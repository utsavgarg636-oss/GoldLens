<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 68" width="280" height="68">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Capsule -->
  <rect x="2" y="2" width="276" height="64" rx="16" fill="url(#badgeBg)" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.4" filter="url(#cardShadow)" />
  
  <!-- Icon Circle -->
  <g transform="translate(10, 10)">
    <circle cx="22" cy="22" r="20" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="22" y="30" font-size="22" text-anchor="middle">👑</text>
  </g>
  
  <!-- Brand Typography -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#0F172A">
    Gold<tspan fill="url(#goldGrad)">Lens</tspan>
  </text>
  <text x="64" y="49" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="800" font-size="9" fill="#92400E" letter-spacing="1.2">
    MCX RELATIVE VALUE DESK
  </text>
</svg>
